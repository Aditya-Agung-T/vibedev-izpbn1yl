<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Game Night Planner</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Board Game Night Planner</h1><p>Build your shelf, then pick tonight's game.</p><div id="stats" aria-live="polite"></div></header><main><section aria-labelledby="collection-title"><h2 id="collection-title">Collection</h2><form id="game-form" novalidate><input type="hidden" name="id"><h3 id="form-title">Add a game</h3><label>Name <input required maxlength="80" name="name" aria-describedby="name-error"><small id="name-error" class="field-error"></small></label><label>Min players <input required type="number" min="1" max="99" name="minPlayers" aria-describedby="minPlayers-error"><small id="minPlayers-error" class="field-error"></small></label><label>Max players <input required type="number" min="1" max="99" name="maxPlayers" aria-describedby="maxPlayers-error"><small id="maxPlayers-error" class="field-error"></small></label><label>Minutes <input required type="number" min="1" max="1440" name="playMinutes" aria-describedby="playMinutes-error"><small id="playMinutes-error" class="field-error"></small></label><label>Rating <input required type="number" min="1" max="5" name="rating" aria-describedby="rating-error"><small id="rating-error" class="field-error"></small></label><label>Tags, comma separated <input name="tags" aria-describedby="tag-help tags-error"><small id="tag-help">Separate tags with commas. Each tag may be 24 characters.</small><small id="tags-error" class="field-error"></small></label><label>Status <select name="status"><option value="want">Want to play</option><option value="played">Played</option></select></label><button type="submit">Save game</button><button type="button" id="cancel">Cancel</button><p id="form-error" role="alert" aria-live="polite"></p></form><div class="filters"><label>Search <input id="search" aria-label="Search games"></label><label>Status <select id="status" aria-label="Filter by status"><option value="all">All</option><option value="want">Want to play</option><option value="played">Played</option></select></label><label>Tag <select id="tag" aria-label="Filter by tag"><option value="all">All tags</option></select></label><button type="button" id="clear">Clear filters</button></div><p id="count" aria-live="polite"></p><div id="games"></div><div id="empty"></div></section><aside aria-labelledby="picker-title"><h2 id="picker-title">Game Night Picker</h2><label>Players <input id="players" type="number" min="1" max="99" value="4"></label><p id="eligible" aria-live="polite"></p><button type="button" id="pick">Pick Tonight's Game</button><div id="result" aria-live="polite"></div></aside></main><div id="storage" role="alert" aria-live="assertive"></div><dialog id="confirm" aria-labelledby="confirm-text"><p id="confirm-text"></p><button type="button" id="yes">Delete</button><button type="button" id="no">Cancel</button></dialog><script type="module" src="./src/app.js"></script></body></html>
