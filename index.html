<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Game Night Planner</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Board Game Night Planner</h1><p>Build your shelf, then pick tonight's game.</p><div id="stats" aria-live="polite"></div></header><main><section><h2>Collection</h2><form id="game-form"><input type="hidden" name="id"><label>Name <input required maxlength="80" name="name"></label><label>Min players <input required type="number" min="1" max="99" name="minPlayers"></label><label>Max players <input required type="number" min="1" max="99" name="maxPlayers"></label><label>Minutes <input required type="number" min="1" max="1440" name="playMinutes"></label><label>Rating <input required type="number" min="1" max="5" name="rating"></label><label>Tags (comma separated) <input name="tags" maxlength="24" aria-describedby="tag-help"><small id="tag-help">Use commas to separate tags. Each tag: 24 characters max.</small></label><label>Status <select name="status"><option value="want">Want to play</option><option value="played">Played</option></select></label><button>Save game</button><button type="button" id="cancel">Cancel</button><p id="form-error" role="alert"></p></form><div class="filters"><label>Search <input id="search" aria-label="Search games"></label><label>Status <select id="status" aria-label="Filter by status"><option value="all">All</option><option value="want">Want to play</option><option value="played">Played</option></select></label><label>Tag <select id="tag" aria-label="Filter by tag"><option>all</option></select></label><button type="button" id="clear">Clear filters</button></div><p id="count"></p><div id="games"></div><div id="empty"></div></section><aside><h2>Game Night Picker</h2><label>Players <input id="players" type="number" min="1" max="99" value="4"></label><p id="eligible"></p><button type="button" id="pick">Pick Tonight's Game</button><div id="result" aria-live="polite"></div></aside></main><div id="storage" role="alert"></div><dialog id="confirm"><p id="confirm-text"></p><button id="yes">Delete</button><button id="no">Cancel</button></dialog><script type="module" src="./src/app.js"></script></body></html>
